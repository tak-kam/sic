[workspace]
resolver = "3"
members = [
    "crates/sic-core",
    "crates/sic-syntax",
    "crates/sic-types",
    "crates/sic-ir",
    "crates/sic-bytecode",
    "crates/sic-compile",
    "crates/sic-plan",
    "crates/sic-verify",
    "crates/sic-vm",
    "crates/sic-journal",
    "crates/sic-json",
    "crates/sic-otel",
    "crates/sic-broker",
    "crates/sic-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tak-kam/sic"

# No external dependency is ever added here. To propose one, document in
# docs/design/ why it is needed, why std is insufficient, how much the
# dependency tree grows, the cost of writing it by hand, and the security impact.
[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[profile.release]
panic = "abort"
overflow-checks = true
