[package]
name = "sic-plan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sic-core = { path = "../sic-core" }
sic-bytecode = { path = "../sic-bytecode" }
sic-json = { path = "../sic-json" }

# Not a dependency, and it must not become one: the analysis reads bytecode,
# where trust is erased, and has to keep working on a `.sicb` that arrived with
# no source and no compiler. This is here for one test, which holds the list of
# untrusted capabilities in `flow.rs` to what `sic-types` declares - because
# that list is a second copy of a fact, and a second copy without a test is how
# the next capability somebody adds becomes a flow nobody is told about.
[dev-dependencies]
sic-types = { path = "../sic-types" }

[lints]
workspace = true
