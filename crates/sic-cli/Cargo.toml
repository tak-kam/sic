[package]
name = "sic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sic"
path = "src/main.rs"

[dependencies]
sic-core = { path = "../sic-core" }
sic-syntax = { path = "../sic-syntax" }
sic-types = { path = "../sic-types" }
sic-ir = { path = "../sic-ir" }
sic-bytecode = { path = "../sic-bytecode" }
sic-compile = { path = "../sic-compile" }
sic-plan = { path = "../sic-plan" }
sic-verify = { path = "../sic-verify" }
sic-vm = { path = "../sic-vm" }
sic-journal = { path = "../sic-journal" }
sic-json = { path = "../sic-json" }
sic-otel = { path = "../sic-otel" }
sic-broker = { path = "../sic-broker" }

# The CLI is a binary, so its integration tests cannot reach its own
# dependencies. This one needs to build a program that decodes and does not
# verify, which is the only way to test that nothing runs unverified bytecode.
[dev-dependencies]
sic-bytecode = { path = "../sic-bytecode" }

[lints]
workspace = true
