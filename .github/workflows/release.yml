# Builds and publishes binaries when a version tag is pushed.
#
# `actions/checkout` is again the only third-party action: `gh` is already on
# every runner, so the release itself is made with it rather than with an action
# that would have to be trusted.
#
# Every artifact is listed in SHA256SUMS. That is not decoration - `sic` pins
# executables by digest, and `sic upgrade` checks one against SHA256SUMS, so a release
# that does not publish its own digests would be asking for trust it has not
# earned.
#
# **No `${{ }}` appears inside a `run:` block.** An expression is substituted as
# text before the shell sees the line, and git accepts `$( )`, backticks, `;`
# and `"` in a tag name - so `${{ github.ref_name }}` in a script would not be an
# argument to `gh`, it would be part of the program, in the one workflow here
# that can write to a release. Values reach a script through `env:`, where a
# value is a value.
#
# The rule covers the matrix entries too, though those are literals written in
# this file and could hold nothing dangerous. A rule with no exceptions can be
# checked by looking; one with two can be checked by whoever remembers which
# two. See #96.
name: Release

on:
  push:
    tags: ["v*"]

# Nothing is granted at the top, so a job that says nothing gets nothing. Two of
# the three touch the release and say so; `build` compiles and uploads, which is
# still a write, and the difference is that a job cannot acquire the authority
# by being added later.
permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # `v` and a version, or nothing happens. Every later job needs this one,
      # so a tag of another shape reaches no step that can write to a release.
      #
      # This belongs on the tag namespace, and GitHub's rule for that -
      # `tag_name_pattern` in a ruleset - is not available on this plan; the
      # API refuses it while accepting the rest of a tag ruleset. So it lives
      # here instead, which is the better half of the trade anyway: a check in
      # the repository is visible in a diff, travels with a clone and can be
      # read by whoever is reviewing the workflow, and a settings page is none
      # of those. #98 makes the same argument about the token.
      #
      # The shell never sees the tag as text - `$TAG` is a value, which is
      # #96 - and this is the belt to that pair of braces rather than a
      # replacement for it.
      - name: The tag is a version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # `=~` matches the whole string: `$` is the end of it and not the end
          # of a line, so a name with a newline in it cannot pass by having one
          # good line. Git refuses a newline in a ref anyway - this does not
          # depend on that being true.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to release from the tag: $TAG"
            exit 1
          fi
          echo "releasing $TAG"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes "See the commit history for what changed. Binaries and SHA256SUMS are attached below."

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs anywhere. Nothing here links a C
          # library, so it is a static build with no cross toolchain.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add "$TARGET"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
        run: |
          name="sic-$TAG-$TARGET"
          mkdir -p "$name"
          cp LICENSE-MIT LICENSE-APACHE README.md "$name/"
          # One directory either way, so that unpacking a release puts the
          # binary at a path SHA256SUMS can name.
          if [ "$OS" = "windows-latest" ]; then
            cp "target/$TARGET/release/sic.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/$TARGET/release/sic" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
        run: |
          name="sic-$TAG-$TARGET"
          if [ "$OS" = "windows-latest" ]; then
            gh release upload "$TAG" "$name.zip"
          else
            gh release upload "$TAG" "$name.tar.gz"
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          mkdir -p dist && cd dist
          gh release download "$TAG" --repo "$REPO"

          # The archives, and the binary inside each one. `sic upgrade` checks a
          # binary against a digest, so publishing only the archives' digests
          # would leave that check with nothing to compare against. The names
          # are the paths unpacking produces, so a line here is a line a person
          # can check locally with sha256sum -c.
          for archive in *.tar.gz; do tar xzf "$archive"; done
          for archive in *.zip; do unzip -q -o "$archive"; done

          files=(*.tar.gz *.zip sic-*/sic sic-*/sic.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no release assets to hash"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$REPO"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
