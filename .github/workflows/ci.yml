# The checks that have to pass on main.
#
# `actions/checkout` is the only third-party action here. The zero-dependency
# rule is about the crates the compiler links, not about CI, but the same
# instinct applies: rustup is already on the runner, so nothing else is pulled
# in to set up a toolchain.
#
# It is pinned to a commit, not to `v4`. A tag is a name somebody else can move,
# and a crate in `Cargo.lock` is not named that way - there is no argument that
# the CI supply chain is the less exposed of the two. The version is in the
# comment so that a reader knows what they have and a bump is a legible diff.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# What the token may do, said here rather than left to a repository setting.
# The setting is right today and is a checkbox: changeable by anybody with
# admin access, invisible in a diff, and absent from a clone. This job runs
# `cargo test`, which runs code from the branch under test, and what that code
# can reach belongs next to it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody has to fix is a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # The rule the whole project is arranged around, checked rather than
      # trusted. `[dependencies]` names only paths inside the workspace.
      - name: No external dependencies
        run: |
          external=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "
          import json, sys
          names = {
              d['name']
              for p in json.load(sys.stdin)['packages']
              for d in p['dependencies']
              if d.get('path') is None
          }
          print(' '.join(sorted(names)))
          ")
          if [ -n "$external" ]; then
            echo "external dependencies found: $external"
            exit 1
          fi
          echo "no external dependencies"

      # A committed lockfile that disagrees with the manifests would mean the
      # tree does not build from a clean checkout.
      - name: Lockfile is current
        run: cargo metadata --format-version 1 --locked > /dev/null

  # The release publishes binaries for four targets and this job is the only
  # thing that compiles for three of them. It is not a matrix of runners,
  # because what goes wrong is a compile and a compile does not need the
  # platform it is for: `cargo check --target` on the runner already here says
  # everything a `#[cfg]` mistake has to say, without linking and without a
  # second machine.
  #
  # It exists because the tree stopped compiling for Windows the day
  # `sic-broker::route` was added and nothing noticed for a week - the next tag
  # would have found out, during a release.
  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc
          rustc --version

      # The targets `release.yml` publishes, minus the one the job above
      # already builds and tests. A target nobody ships is a target nobody has.
      - name: Compiles for every target the release publishes
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            echo "== $target"
            cargo check --workspace --all-targets --locked --target "$target"
          done

  # `rust-version` in the workspace manifest is a promise made to whoever
  # builds sic from source, and Cargo uses it when resolving. A minimum
  # nothing compiles against is a guess, and it drifts one way only: every
  # release of Rust makes it easier to write something the manifest does not
  # allow. Let-chains stabilised in 1.88 and cannot be used here; this is what
  # remembers that instead of a person.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Toolchain
        # No `rustup update`: the point is to use exactly this one. The version
        # is read from the manifest so that raising it is one edit.
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "the manifest says $msrv"
          rustup toolchain install --no-self-update --profile minimal "$msrv"
          rustup default "$msrv"
          rustc --version

      # `check` rather than `build`: what this job is for is whether the code
      # compiles under the declared minimum, and codegen does not bear on that.
      # `--all-targets` because a test that needs a newer compiler breaks
      # `cargo test` for the same person.
      - name: Compiles under the declared minimum
        run: cargo check --workspace --all-targets --locked
